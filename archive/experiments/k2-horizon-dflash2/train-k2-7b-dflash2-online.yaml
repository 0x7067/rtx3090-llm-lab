# SpecForge online (disaggregated, managed-local) DFlash2 training for
# IFM/K2-Horizon-7B. Adapted from examples/configs/online/disaggregated/
# managed-local/qwen3.6-27b-dflash2-disaggregated.yaml. Single node, two
# GPUs: GPU 0 = SGLang capture server (target bf16, 18 GB + KV), GPU 1 =
# trainer. On one 80 GB H100 both fit: set both cuda_visible_devices to "0"
# and mem_fraction_static to 0.35.
model:
  target_model_path: IFM/K2-Horizon-7B
  draft_model_config: configs/k2-horizon-7b-dflash2.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.embed_tokens.weight
  lm_head_key: lm_head.weight
  torch_dtype: bfloat16
  mask_token_id: 250623
  sglang_context_length: 8250

data:
  train_data_path: cache/dataset/k2-7b-regen.jsonl
  max_length: 8192
  chat_template: k2-horizon-thinking
  cache_dir: cache/k2-7b-dflash2
  build_dataset_num_proc: 32

training:
  strategy: dflash
  num_epochs: 6
  max_steps: 40000
  batch_size: 1
  accumulation_steps: 4
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 7.0
  lk_loss_type: lambda
  loss_type: dpace
  objective_chunk_blocks: 128
  dflash2_selector_loss_alpha: 1.0
  dflash2_selector_warmup_ratio: 0.0005
  dflash2_selector_ramp_ratio: 0.0005
  save_interval: 500
  log_interval: 10
  dist_timeout: 30
  seed: 42

tracking:
  report_to: tensorboard

runtime:
  producer_lease: 4
  producer_concurrency: 2
  in_flight_high_watermark: 100
  in_flight_low_watermark: 40

run_id: k2-horizon-7b-dflash2
output_dir: outputs/k2-horizon-7b-dflash2

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: outputs/k2-horizon-7b-dflash2/control
    consumer_state_dir: outputs/k2-horizon-7b-dflash2/consumer-state
    backend: mooncake
    managed_local:
      trainer_cuda_visible_devices: ["1"]
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 68719476736
        local_buffer_size_bytes: 1073741824
        default_kv_lease_ttl_ms: 5000
      capture_servers:
        - port: 30000
          cuda_visible_devices:
            - "0"
          tp_size: 1
          mem_fraction_static: 0.8
