models:
  "qwen3.8-27b":
    # Q4 drafter and CPU vision leave room for two slots without changing target weights.
    # The 131k KV pool is shared. The admission patch queues requests whose combined
    # prompt/output budgets exceed it, so long requests retain the full context.
    # Keep these kernel controls local to Qwen; other backends have different crossovers.
    env:
      - "GGML_CUDA_MMVQ_NE11_MAX=3"
      - "GGML_CUDA_MMQ_SMALLN=3"
      # llama-swap strips quotes from JSON passed as command arguments.
      - 'LLAMA_ARG_CHAT_TEMPLATE_KWARGS={"reasoning_effort":"medium"}'
    cmd: >
      /usr/local/bin/llama-server
      -m /models/qwen3.8/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL-v3.gguf
      --mmproj /models/qwen3.8/ggml-org/Qwen3.8-27B-GGUF/mmproj-Qwen3.8-27B-Q8_0.gguf
      --no-mmproj-offload
      --host 0.0.0.0 --port ${PORT}
      --ctx-size 131072
      --predict 131072
      --threads 8 --threads-batch 8 --parallel 2
      --kv-unified --kv-unified-per-slot 131072
      --batch-size 512 --ubatch-size 512
      --no-mmap -fa on --jinja
      --cache-type-k q4_0 --cache-type-v q4_0
      --cache-type-k-draft q4_0 --cache-type-v-draft q4_0
      --temp 1.0 --top-k 20 --top-p 0.95 --min-p 0.0 --repeat-penalty 1.0
      --model-draft /models/qwen3.8/z-lab/Qwen3.8-27B-DFlash2-GGUF/Qwen3.8-27B-DFlash2-Q4_K_M.gguf
      --spec-type draft-dflash,ngram-mod --spec-draft-n-max 7
      --spec-ngram-mod-n-match 32
      -ngl 99 -ngld 99
    ttl: 3600
