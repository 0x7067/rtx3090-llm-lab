# SpecForge offline colocated EAGLE-3 training for IFM/K2-Horizon-7B on one
# RTX 3090. Features are captured first with scripts/prepare_hidden_states.py
# (target bf16 alone on the GPU), then the 1-layer draft trains against the
# stored features without the target loaded. Adapted from
# examples/configs/offline/colocated/qwen3-8b-eagle3-offline.yaml.
model:
  target_model_path: /data/buttercup_6tb/specforge-work/models/IFM/K2-Horizon-7B
  draft_model_config: /data/docker-services/rtx3090-llm-lab/experiments/k2-horizon-dflash2/configs/k2-horizon-7b-eagle3.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.embed_tokens.weight
  lm_head_key: lm_head.weight
  torch_dtype: bfloat16

data:
  hidden_states_path: /data/buttercup_6tb/specforge-work/cache/hidden_states/k2-7b-eagle3-regen
  max_length: 8192
  chat_template: k2-horizon-thinking
  cache_dir: /data/buttercup_6tb/specforge-work/cache

training:
  strategy: eagle3
  # Measured on the 3090 at max_length 2048: ~1 step/s at batch_size 1, so one
  # epoch over 16,000 samples was ~4.5 h. This set is 8,777 samples but four
  # times the sequence cap, so re-measure step time before budgeting. Ten
  # epochs (the upstream Qwen3-8B recipe) is out of reach with production
  # offline; 2 epochs is the validation budget. Raise once the pipeline has
  # proven its speedup.
  num_epochs: 2
  batch_size: 1
  learning_rate: 1.0e-4
  max_grad_norm: 0.5
  # 4, not the upstream 7. The TTT-expanded draft logits are
  # ttt_length x seq x draft_vocab and are retained for the backward pass, so
  # ttt_length is the term that decides whether an 8,192-token row fits on a
  # 24 GB card. At 7 training died in compute_acceptance_rate asking for
  # 866 MiB against 22.36 GiB already allocated, with fragmentation already
  # ruled out. Serve with --spec-draft-n-max 4 to match the trained depth.
  ttt_length: 4
  attention_backend: flex_attention
  # Exact lower-memory teacher projection: without it the 250,624-vocab logits
  # are materialised in full and the run sits at 22.6/24 GB with hundreds of
  # allocator OOM retries (observed 2026-09-04, first attempt).
  compact_teacher: true
  save_interval: 2000
  log_interval: 50
  dist_timeout: 20
  seed: 0

tracking:
  report_to: tensorboard

run_id: k2-horizon-7b-eagle3-regen
output_dir: /data/buttercup_6tb/specforge-work/outputs/k2-horizon-7b-eagle3-regen

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 1
