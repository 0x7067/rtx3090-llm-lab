# llama-swap on :8080 is the only door into this pod, and it gates every request
# with the bearer token. The finance OCR worker runs a vLLM on :8000 and its job
# API on :9417 inside the same pod network namespace; neither authenticates, so
# only :8080 is opened. Any pod in any namespace may reach it (in-cluster clients
# such as firecrawl call it directly), as may Caddy (hostNetwork, so it arrives
# from the node/LAN rather than a pod selector), the tailnet and the node's own
# kubelet probes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llama
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: llama}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
        - ipBlock: {cidr: 192.168.3.0/24}
        - ipBlock: {cidr: 100.64.0.0/10}
        - ipBlock: {cidr: 10.42.0.0/16}
      ports:
        - {protocol: TCP, port: 8080}
    # vllm-metrics sidecar: Prometheus only (it serves unauthenticated metrics),
    # plus the node's kubelet probes.
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
        - ipBlock: {cidr: 10.42.0.0/16}
      ports:
        - {protocol: TCP, port: 9106}
